# Compares 100 vs 300 episodes for the "reward scaling + percentage deltas" variant.
# Used by:
# - compare_episodes_metrics.py
# - generate_confusion_plots.py
# - generate_ranking_table.py
output_prefix: deltas
# When true, generate_confusion_plots.py emits one combined 100-vs-300-episodes
# role-confusion chart instead of two separate ones (requires exactly 2 experiments).
combine_role_confusion: true
# Leave empty to include all algorithms; otherwise list algorithms to exclude.
# Valid names: Q-Learning, SARSA, DQN, PPO, A2C
excluded_algorithms: []
experiments:
  - label: "100_episodes"
    path: "_training/attacks_ho/20260730-130311_1_5_5"
    description: "Group 1: 100 episodes, 1_5_5 (reward scaling + percentage deltas)"

  - label: "300_episodes"
    path: "_training/attacks_ho/20260804-093406_1_5_5"
    description: "Group 2: 300 episodes, 1_5_5 (reward scaling + percentage deltas)"