# Compares Tier A alerting-channel strategies for paper9, both with Policy Exchange
# (S3) layered on top: S0+S3 (naive_broadcast) vs S1+S3 (UAQ, tau=0.8).
# N=10 (1_5_5), seed=77, 100 train episodes, all 3 flags true (see paper9.tex sec:exp_setup).
output_prefix: tier_b_s3
fig_height: 5.0
combine_role_confusion: true
confusion_matrix_grid: true
confusion_matrix_layout: inline
excluded_algorithms: [DQN]
experiments:
  - label: "S0+S3"
    path: "_training/marl_pz/20260814-100046_1_5_5"
    description: "naive_broadcast + policy_exchange (S3), N=10, seed=77"

  - label: "S1+S3"
    path: "_training/marl_pz/20260817-091109_1_5_5"
    description: "UAQ (tau=0.8) + policy_exchange (S3), N=10, seed=77"
