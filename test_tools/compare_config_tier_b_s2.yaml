# Compares Tier A alerting-channel strategies for paper9, both with Federated
# Synchronization (S2) layered on top: S0+S2 (naive_broadcast) vs S1+S2 (UAQ, tau=0.8).
# N=10 (1_5_5), seed=77, 100 train episodes, all 3 flags true (see paper9.tex sec:exp_setup).
output_prefix: tier_b_s2
fig_height: 5.0
combine_role_confusion: true
confusion_matrix_grid: true
confusion_matrix_layout: inline
excluded_algorithms: [DQN]
experiments:
  - label: "S0+S2"
    path: "_training/marl_pz/20260813-091949_1_5_5"
    description: "naive_broadcast + federated_sync (S2), N=10, seed=77"

  - label: "S1+S2"
    path: "_training/marl_pz/20260816-174823_1_5_5"
    description: "UAQ (tau=0.8) + federated_sync (S2), N=10, seed=77"
